<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Măr Roșu 3D — Studio Procedural Three.js</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b1120;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .studio-hud {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 10;
        background: rgba(15, 23, 42, 0.78);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 10px;
        padding: 10px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: auto;
        max-width: 260px;
      }
      .studio-hud h1 {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.4px;
        color: #f8fafc;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .studio-hud .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ef4444;
        box-shadow: 0 0 8px #ef4444;
      }
      .studio-controls {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .studio-btn {
        background: rgba(30, 41, 59, 0.9);
        color: #e2e8f0;
        border: 1px solid rgba(148, 163, 184, 0.3);
        border-radius: 6px;
        padding: 4px 9px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .studio-btn:hover {
        background: rgba(51, 65, 85, 0.95);
        border-color: #f87171;
      }
      .studio-btn.active {
        background: #b91c1c;
        border-color: #f87171;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="studio-hud">
        <h1><span class="dot"></span> Măr Roșu 3D (C¹ Parametric)</h1>
        <div class="studio-controls">
          <button id="btn-turntable" class="studio-btn active" type="button">Turntable</button>
          <button id="btn-idle" class="studio-btn" type="button">Static</button>
          <button id="btn-wireframe" class="studio-btn" type="button">Wireframe</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
